<title>Prototipo Tienda con WhatsApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: barra de modo arriba; debajo, una sola columna de app (tienda o admin) centrada, que se abre en grilla en pantallas anchas */
:root{
  --bg:#ffffff; --surface:#f3f3f0; --line:#d4d4cf; --line-soft:#e6e6e2;
  --fg:#1d1d1b; --muted:#5d5d58; --accent:#1d1d1b; --on-accent:#ffffff;
  --warn-bg:#fff4d6; --warn-fg:#5a4300; --ok-fg:#1e5b32;
  --font:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161615; --surface:#22221f; --line:#3d3d38; --line-soft:#2d2d29;
  --fg:#f1f1ec; --muted:#b4b4ac; --accent:#f1f1ec; --on-accent:#161615;
  --warn-bg:#3d3214; --warn-fg:#ffe7a6; --ok-fg:#8fd6a5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161615; --surface:#22221f; --line:#3d3d38; --line-soft:#2d2d29;
  --fg:#f1f1ec; --muted:#b4b4ac; --accent:#f1f1ec; --on-accent:#161615;
  --warn-bg:#3d3214; --warn-fg:#ffe7a6; --ok-fg:#8fd6a5; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:16px;line-height:1.45;padding-inline:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--fg)}
:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3{text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}

/* barra de modo */
.modebar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;background:var(--line-soft);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;min-height:40px;padding:0 14px;font-size:15px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--bg);font-weight:700;box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.modebar .spacer{flex:1}
.ghost{border:1px solid var(--line);background:var(--bg);border-radius:10px;min-height:40px;padding:0 12px;cursor:pointer;font-size:15px}

.wrap{max-width:1100px;margin:0 auto;padding:0 16px 120px}
.topbar{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.logo{height:36px;padding:0 14px;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;font-weight:700;font-size:15px;cursor:pointer}
.iconbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.badge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.btn{min-height:52px;border-radius:var(--r);border:0;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:17px;padding:0 20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.sec{background:var(--bg);color:var(--fg);border:1px solid var(--fg)}
.btn.small{min-height:44px;font-size:15px;padding:0 14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;text-decoration:underline;cursor:pointer;padding:8px 0;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.chip{min-height:42px;padding:0 14px;border-radius:21px;border:1px solid var(--line);background:var(--bg);white-space:nowrap;cursor:pointer;font-size:15px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.subchips .chip{min-height:36px;border-radius:8px;font-size:14px}
.search{display:flex;align-items:center;gap:8px;min-height:48px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:0 12px}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px 14px}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.ph{aspect-ratio:4/5;max-width:100%;border-radius:10px;background:var(--surface);border:1px solid var(--line-soft);display:flex;align-items:flex-start;justify-content:flex-start;overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .tag{position:absolute;top:8px;left:8px;background:var(--bg);border:1px solid var(--line);padding:2px 8px;border-radius:6px;font-size:13px;font-weight:700}
.ph .ini{margin:auto;font-size:28px;font-weight:700;color:var(--muted)}
.price{font-weight:700;font-variant-numeric:tabular-nums}
.dim{opacity:.6}
.sticky-cart{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 32px));z-index:15}
.sticky-cart .btn{width:100%;justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:14px}
.alert{border:2px solid var(--fg);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.warn{background:var(--warn-bg);color:var(--warn-fg);border-radius:10px;padding:10px 12px;font-size:15px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span:first-child{font-weight:700}
.input{min-height:52px;border:1px solid var(--muted);border-radius:10px;padding:0 14px;background:var(--bg);font-size:17px;width:100%}
textarea.input{padding:12px 14px;min-height:88px;resize:vertical}
.input[aria-invalid="true"]{border:2px solid var(--fg)}
.err{font-size:15px;font-weight:700}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;border:1px solid var(--muted);border-radius:var(--r);padding:10px 14px;cursor:pointer}
.opt:has(input:checked){border:2px solid var(--fg)}
.opt input{width:22px;height:22px;accent-color:var(--fg)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:16px;align-items:start}
.sizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.size{min-height:52px;border-radius:10px;border:1px solid var(--muted);background:var(--bg);cursor:pointer;font-size:16px}
.size[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border:2px solid var(--accent);font-weight:700}
.size[disabled]{border-style:dashed;color:var(--muted);text-decoration:line-through;cursor:not-allowed;background:var(--surface)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--muted);border-radius:var(--r)}
.qty button{width:44px;height:48px;border:0;background:transparent;font-size:22px;cursor:pointer}
.qty button[disabled]{opacity:.35;cursor:not-allowed}
.qty span{min-width:28px;text-align:center;font-weight:700}
.line{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line-soft)}
.thumb{width:72px;flex-shrink:0}
.spin{width:48px;height:48px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--fg);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:3s}}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.steps li{display:flex;gap:12px;align-items:center}
.dot{width:26px;height:26px;border-radius:13px;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.dot.done{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.dot.now{border:3px solid var(--fg)}
.bignum{font-size:46px;font-weight:700;letter-spacing:.02em}
.msg{white-space:pre-wrap;background:var(--bg);border:2px solid var(--fg);border-radius:14px 14px 4px 14px;padding:12px 14px;font-size:15px;max-width:420px;align-self:flex-end}
/* admin */
.anav{display:flex;gap:6px;border-bottom:1px solid var(--line-soft);padding:8px 0}
.anav button{min-height:44px;padding:0 16px;border-radius:10px;border:0;background:transparent;cursor:pointer;font-size:16px}
.anav button[aria-current="page"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.ocard{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.pill{font-size:13px;padding:3px 10px;border-radius:6px;background:var(--line-soft);font-weight:700;white-space:nowrap}
.pill.strong{background:transparent;border:2px solid var(--fg)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:12px}
.prow{border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.prow-head{display:flex;gap:12px;align-items:center;padding:12px;cursor:pointer;width:100%;background:none;border:0;text-align:left}
.prow-head .ph{width:56px;aspect-ratio:1}
.stockline{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:10px;padding:6px 6px 6px 12px}
.stockline .lab{flex:1}
.stepbtn{width:44px;height:44px;border-radius:8px;border:1px solid var(--fg);background:var(--bg);font-size:20px;cursor:pointer}
.stepbtn[disabled]{opacity:.35;cursor:not-allowed}
.grid-stock{overflow-x:auto}
.grid-stock table{border-collapse:separate;border-spacing:6px}
.grid-stock th{font-size:15px}
.grid-stock input{width:64px;min-height:46px;text-align:center;border:1px solid var(--muted);border-radius:8px;background:var(--bg);font-size:17px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.photo{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .pb{position:absolute;bottom:4px;left:4px;right:4px;display:flex;gap:4px;justify-content:space-between}
.photo .pb button{font-size:12px;border:0;border-radius:6px;padding:4px 6px;background:var(--bg);cursor:pointer}
.photo .main{position:absolute;top:4px;left:4px;font-size:12px;background:var(--accent);color:var(--on-accent);padding:2px 6px;border-radius:4px}
.drop{aspect-ratio:1;border:2px dashed var(--muted);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-size:14px;text-align:center;padding:6px}
.drop.over{background:var(--surface)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--on-accent);border-radius:12px;padding:10px 10px 10px 16px;display:flex;gap:12px;align-items:center;z-index:40;width:min(520px,calc(100% - 32px))}
.toast span{flex:1}
.toast button{background:transparent;border:1px solid var(--on-accent);color:var(--on-accent);border-radius:8px;min-height:40px;padding:0 12px;font-weight:700;cursor:pointer}
.sheet-bg{position:fixed;inset:0;background:rgb(0 0 0 / .5);z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.sheet{background:var(--bg);border-radius:18px;padding:20px 16px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
@media (min-width:700px){.sheet-bg{align-items:center}}
.status-ok{color:var(--ok-fg);font-weight:700}
hr{border:0;border-top:1px solid var(--line-soft);margin:4px 0}
.login{max-width:420px;margin:48px auto;display:flex;flex-direction:column;gap:20px;text-align:center}
</style>

<div class="modebar" role="toolbar" aria-label="Modo del prototipo">
  <div class="seg">
    <button type="button" id="m-store" data-act="mode" data-v="store">Tienda (comprador)</button>
    <button type="button" id="m-admin" data-act="mode" data-v="admin">Admin (comercio)</button>
  </div>
  <span class="spacer"></span>
  <button type="button" class="ghost" id="tools-btn" data-act="tools">Herramientas de prueba</button>
</div>
<main id="app" class="wrap" aria-live="polite"></main>
<div id="overlay"></div>
<div id="toast"></div>

<script>
(function(){
'use strict';
const KEY='tiendaWA-proto-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$ '+Math.round(n).toLocaleString('es-AR');
const H=3600*1000;

function seed(){
  return {
    v:1, nextNum:1001, offset:0, resHours:24, waNumber:'',
    categories:[{name:'Mujer',subs:['Remeras','Vestidos','Pantalones']},{name:'Hombre',subs:['Remeras','Buzos']},{name:'Accesorios',subs:[]}],
    products:[
      {id:'p1',name:'Remera básica',cat:'Mujer › Remeras',price:15000,desc:'Algodón peinado, calce regular.',code:'RB-01',visible:true,colors:['Negro','Blanco'],sizes:['S','M','L','XL'],stock:{'Negro|S':2,'Negro|M':1,'Negro|L':3,'Negro|XL':0,'Blanco|S':0,'Blanco|M':4,'Blanco|L':2,'Blanco|XL':1},photos:[]},
      {id:'p2',name:'Jean mom',cat:'Mujer › Pantalones',price:27000,desc:'Tiro alto, denim rígido.',code:'',visible:true,colors:[],sizes:['36','38','40','42'],stock:{'-|36':1,'-|38':1,'-|40':2,'-|42':0},photos:[]},
      {id:'p3',name:'Vestido lino',cat:'Mujer › Vestidos',price:35000,desc:'Lino liviano, largo midi.',code:'',visible:true,colors:['Arena'],sizes:['S','M','L'],stock:{'Arena|S':0,'Arena|M':0,'Arena|L':0},photos:[]},
      {id:'p4',name:'Buzo oversize',cat:'Hombre › Buzos',price:29000,desc:'Frisa invisible, capucha.',code:'BZ-GR',visible:true,colors:['Gris'],sizes:['M','L','XL'],stock:{'Gris|M':3,'Gris|L':4,'Gris|XL':2},photos:[]},
      {id:'p5',name:'Gorro de lana',cat:'Accesorios',price:9000,desc:'Talle único.',code:'',visible:true,colors:['Negro','Crudo'],sizes:[],stock:{'Negro|-':5,'Crudo|-':3},photos:[]}
    ],
    orders:[]
  };
}
let S; try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||S.v!==1)S=seed();
let saveWarn=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));saveWarn=false}catch(e){saveWarn=true}}

const U={mode:'store',
  st:{view:'catalog',cat:null,sub:null,q:'',pid:null,color:null,size:null,qty:1,errors:{},form:{name:'',phone:'',delivery:'envio',address:'',locality:'',payment:'transferencia',note:''},lastNum:null},
  ad:{logged:false,view:'orders',filter:'pendiente',num:null,open:null,openColor:{},saving:{},edit:null,q:'',confirmDel:false,dialog:null}};
let cart=[];
try{const m=localStorage.getItem(KEY+'-mode'); if(m==='admin'||m==='store')U.mode=m}catch(e){}

const now=()=>Date.now()+S.offset;
const P=id=>S.products.find(p=>p.id===id);
function keysOf(p){const cs=p.colors.length?p.colors:['-'],ss=p.sizes.length?p.sizes:['-'];const out=[];cs.forEach(c=>ss.forEach(s=>out.push(c+'|'+s)));return out}
const keyOf=(c,s)=>(c||'-')+'|'+(s||'-');
function label(k){const[c,s]=k.split('|');return [c!=='-'?c:'',s!=='-'?'Talle '+s:''].filter(Boolean).join(' · ')||'Único'}
function expire(){let ch=false;S.orders.forEach(o=>{if(o.status==='pendiente'&&now()>o.expiresAt){o.status='vencida';ch=true}});if(ch)save()}
function reserved(pid,k,except){let n=0;S.orders.forEach(o=>{if(o.status==='pendiente'&&o.num!==except)o.items.forEach(i=>{if(i.pid===pid&&i.key===k)n+=i.qty})});return n}
function stockOf(p,k){return Math.max(0,p.stock[k]||0)}
function avail(p,k,except){return Math.max(0,stockOf(p,k)-reserved(p.id,k,except))}
function totalAvail(p){return keysOf(p).reduce((a,k)=>a+avail(p,k),0)}
function totalStock(p){return keysOf(p).reduce((a,k)=>a+stockOf(p,k),0)}
function pendingWith(pid,k){return S.orders.filter(o=>o.status==='pendiente'&&o.items.some(i=>i.pid===pid&&i.key===k)).map(o=>o.num)}
function parsePrice(v){const d=String(v).replace(/[^\d]/g,'');return d?parseInt(d,10):NaN}
function waDigits(raw){let d=String(raw||'').replace(/\D/g,'');if(!d)return'';if(d.startsWith('54'))return d;if(d.startsWith('0'))d=d.slice(1);return '549'+d}
function ago(t){const m=Math.round((now()-t)/60000);if(m<1)return'recién';if(m<60)return'hace '+m+' min';const h=Math.round(m/60);if(h<24)return'hace '+h+' h';return'hace '+Math.round(h/24)+' d'}
function left(t){const ms=t-now();if(ms<=0)return'vencida';const h=Math.floor(ms/H);if(h>=1)return'vence en '+h+' h';return'vence en '+Math.max(1,Math.round(ms/60000))+' min'}
function photo(p,cls){const src=p.photos&&p.photos[0];return src?'<img alt="" src="'+src+'">':'<span class="ini" aria-hidden="true">'+esc(p.name.slice(0,1))+'</span>'}
const ICON={
 menu:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
 bag:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>',
 back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
 search:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
 chat:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.5-4A8 8 0 1 1 9 19z"/></svg>',
 check:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>'
};

/* ---------- TIENDA ---------- */
function visibleProducts(){return S.products.filter(p=>p.visible)}
function cartCount(){return cart.reduce((a,i)=>a+i.qty,0)}
function cartTotal(){return cart.reduce((a,i)=>{const p=P(i.pid);return a+(p&&avail(p,i.key)>=i.qty?p.price*i.qty:0)},0)}
function storeHeader(back){
  return '<div class="topbar">'+
   (back?'<button type="button" class="iconbtn" data-act="go" data-v="catalog" aria-label="Volver al catálogo">'+ICON.back+'</button>':'<span style="width:44px"></span>')+
   '<button type="button" class="logo" data-act="home">[Tu marca]</button>'+
   '<button type="button" class="iconbtn" data-act="go" data-v="cart" aria-label="Carrito, '+cartCount()+' productos">'+ICON.bag+(cartCount()?'<span class="badge num">'+cartCount()+'</span>':'')+'</button></div>';
}
function vCatalog(){
  const st=U.st; let list=visibleProducts();
  const q=st.q.trim().toLowerCase();
  if(q)list=list.filter(p=>p.name.toLowerCase().includes(q));
  else if(st.cat){list=list.filter(p=>p.cat.split(' › ')[0]===st.cat&&(!st.sub||p.cat.split(' › ')[1]===st.sub))}
  const catObj=S.categories.find(c=>c.name===st.cat);
  let h=storeHeader(false);
  h+='<div class="stack" style="padding-top:14px">';
  h+='<label class="search">'+ICON.search+'<span class="sr">Buscar productos</span><input id="q" type="search" placeholder="Buscar productos" value="'+esc(st.q)+'" autocomplete="off"></label>';
  if(!q){
   h+='<nav class="chips" aria-label="Categorías"><button type="button" class="chip" data-act="cat" data-v="" aria-pressed="'+(!st.cat)+'">Todo</button>'+S.categories.map(c=>'<button type="button" class="chip" data-act="cat" data-v="'+esc(c.name)+'" aria-pressed="'+(st.cat===c.name)+'">'+esc(c.name)+'</button>').join('')+'</nav>';

  const ae=document.activeElement, aid=ae&&ae.id, sel=ae&&ae.selectionStart;

  const t=$('#toast');t.innerHTML='<div class="toast" role="status"><span>'+esc(text)+'</span>'+(undo?'<button type="button" data-act="undo">Deshacer</button>':'')+'</div>';

function snapshotStock(){return JSON.parse(JSON.stringify(S.products.map(p=>({id:p.id,stock:p.stock}))))}
function restoreStock(snap){snap.forEach(x=>{const p=P(x.id);if(p)p.stock=x.stock})}
function doConfirm(o,force){
  const snap={stock:snapshotStock(),status:o.status,num:o.num};
  o.items.forEach(i=>{const p=P(i.pid);if(p)p.stock[i.key]=Math.max(0,(p.stock[i.key]||0)-i.qty)});
  o.status='confirmada';save();lastUndo=snap;U.ad.dialog=null;
  toast('Venta #'+o.num+' confirmada. Se descontó del stock.',true);render();
}
function doCancel(o){
  const snap={stock:snapshotStock(),status:o.status,num:o.num};
  if(o.status==='confirmada')o.items.forEach(i=>{const p=P(i.pid);if(p)p.stock[i.key]=(p.stock[i.key]||0)+i.qty});
  o.status='cancelada';save();lastUndo=snap;

function submitOrder(){
  // revisa stock en el momento (como el bloqueo de Apps Script)
  const bad=cart.some(i=>{const p=P(i.pid);return !p||avail(p,i.key)<i.qty});
  if(bad){U.st.view='cart';render();return}
  U.st.view='sending';U.st.sendStep=0;render();
  setTimeout(()=>{U.st.sendStep=1;render()},600);
  setTimeout(()=>{
    const bad2=cart.some(i=>{const p=P(i.pid);return !p||avail(p,i.key)<i.qty});
    if(bad2){U.st.view='cart';render();return}
    const items=cart.map(i=>{const p=P(i.pid);return {pid:p.id,name:p.name,key:i.key,qty:i.qty,price:p.price}});
    const o={num:S.nextNum++,createdAt:now(),expiresAt:now()+S.resHours*H,status:'pendiente',items,total:items.reduce((a,i)=>a+i.price*i.qty,0),buyer:Object.assign({},U.st.form)};
    S.orders.push(o);save();U.st.sendStep=2;render();
    setTimeout(()=>{cart=[];U.st.lastNum=o.num;U.st.view='confirm';render();window.scrollTo(0,0)},700);
  },1400);
}

function saveForm(){

  if(d.id){Object.assign(P(d.id),data)}else{data.id='p'+Date.now();S.products.unshift(data)}

function resizeFile(file){
  return new Promise(res=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const m=640,sc=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.72))};img.onerror=()=>res(null);img.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(file)});
}
async function addFiles(files){
  readForm();const d=U.ad.edit;if(!d)return;
  for(const f of files){if(!f.type.startsWith('image/'))continue;const u=await resizeFile(f);if(u)d.photos.push(u)}
  if(d.errors)delete d.errors.photos;render();
}
function bindDrop(){
  const dr=$('#drop');if(!dr)return;
  ['dragenter','dragover'].forEach(ev=>dr.addEventListener(ev,e=>{e.preventDefault();dr.classList.add('over')}));
  ['dragleave','drop'].forEach(ev=>dr.addEventListener(ev,e=>{e.preventDefault();dr.classList.remove('over')}));
  dr.addEventListener('drop',e=>{if(e.dataTransfer&&e.dataTransfer.files)addFiles(e.dataTransfer.files)});
}

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  if(t.dataset.act==='dclose'&&e.target.closest('[data-stop]'))return;
  const a=t.dataset.act,v=t.dataset.v,st=U.st,ad=U.ad;
  switch(a){
   case 'mode':U.mode=v;try{localStorage.setItem(KEY+'-mode',v)}catch(_){}if(v==='admin'&&ad.logged&&st.lastNum&&st.view==='confirm'){ad.view='order';ad.num=st.lastNum}render();window.scrollTo(0,0);break;

   case 'tskip':S.offset+=S.resHours*H+60000;save();closeDialog();toast('Pasaron '+S.resHours+' h. Las reservas pendientes vencieron.');render();break;
   case 'treset':S=seed();cart=[];U.st.view='catalog';U.ad.view='orders';save();closeDialog();toast('Datos de ejemplo restaurados.');render();break;
   case 'home':st.view='catalog';st.cat=null;st.sub=null;st.q='';render();break;
   case 'go':if(v==='checkout'){st.errors={}}st.view=v;render();window.scrollTo(0,0);break;
   case 'cat':st.cat=v||null;st.sub=null;render();break;
   case 'sub':st.sub=v||null;render();break;
   case 'clearq':st.q='';render();break;
   case 'open':{const p=P(v);st.pid=v;st.color=null;st.size=null;st.qty=1;if(p&&p.sizes.length){const c=p.colors.length?(p.colors.find(c=>keysOf(p).some(k=>k.startsWith(c+'|')&&avail(p,k)>0))||p.colors[0]):null;st.size=p.sizes.find(s=>avail(p,keyOf(c,s))>0)||null}st.view='product';render();window.scrollTo(0,0);break}
   case 'color':{st.color=v;const p=P(st.pid);if(p&&st.size&&avail(p,keyOf(v,st.size))<=0)st.size=p.sizes.find(s=>avail(p,keyOf(v,s))>0)||null;st.qty=1;render();break}
   case 'size':st.size=v;st.qty=1;render();break;
   case 'qty':st.qty=Math.max(1,st.qty+parseInt(v,10));render();break;
   case 'add':{const p=P(st.pid);const k=keyOf(st.color,st.size);const ex=cart.find(i=>i.pid===p.id&&i.key===k);if(ex)ex.qty+=st.qty;else cart.push({pid:p.id,key:k,qty:st.qty});toast('Agregaste '+p.name+(label(k)!=='Único'?' ('+label(k)+')':'')+' al carrito.');st.qty=1;render();break}
   case 'cq':{const i=cart[+v];i.qty=Math.max(1,i.qty+parseInt(t.dataset.d,10));render();break}
   case 'rm':cart.splice(+v,1);render();break;
   case 'copy':{const txt=($('#msg')||{}).textContent||'';try{await navigator.clipboard.writeText(txt);toast('Mensaje copiado.')}catch(_){const r=document.createRange();r.selectNodeContents($('#msg'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Seleccioná y copiá el mensaje.')}break}
   case 'login':ad.logged=true;ad.view='orders';render();break;
   case 'anav':ad.view=v;ad.edit=null;ad.confirmDel=false;render();window.scrollTo(0,0);break;
   case 'ofilter':ad.filter=v;render();break;
   case 'oopen':ad.num=+v;ad.view='order';render();window.scrollTo(0,0);break;
   case 'oconfirm':{const o=S.orders.find(x=>x.num===+v);if(!o)break;
     if(o.status==='vencida'){const short=o.items.filter(i=>{const p=P(i.pid);return !p||avail(p,i.key)<i.qty});
       if(short.length){const wa='https://wa.me/'+waDigits(o.buyer.phone)+'?text='+encodeURIComponent('Hola '+o.buyer.name.split(' ')[0]+', lamentablemente se agotó '+short.map(i=>i.name+' ('+label(i.key)+')').join(', ')+' de tu pedido #'+o.num+'.');
         openDialog('<h2 style="font-size:21px">No queda stock libre</h2><p style="margin:0">'+short.map(i=>esc(i.name)+' · '+esc(label(i.key))).join(', ')+': mientras el pedido estaba vencido, otra persona lo pidió o lo descontaste por una venta en el local.</p><a class="btn" target="_blank" rel="noopener" href="'+esc(wa)+'">Avisarle por WhatsApp</a><button type="button" class="btn sec" data-act="oforce" data-v="'+o.num+'">Confirmar igual, tengo la prenda</button><span class="small muted">Si confirmás igual, el stock de esa opción queda en 0 hasta que lo corrijas.</span><button type="button" class="link" data-act="dclose2">Volver sin cambios</button>');break}}
     doConfirm(o);break}
   case 'oforce':{const o=S.orders.find(x=>x.num===+v);closeDialog();if(o)doConfirm(o,true);break}
   case 'ocancel':{const o=S.orders.find(x=>x.num===+v);if(o)doCancel(o);break}
   case 'undo':if(lastUndo){const o=S.orders.find(x=>x.num===lastUndo.num);restoreStock(lastUndo.stock);if(o)o.status=lastUndo.status;save();lastUndo=null;$('#toast').innerHTML='';toast('Listo, se deshizo el cambio.');render()}break;
   case 'ptoggle':ad.open=ad.open===v?null:v;render();break;
   case 'pcolor':ad.openColor[t.dataset.pid]=v;render();break;
   case 'pstep':stepStock(t.dataset.pid,t.dataset.k,parseInt(t.dataset.d,10));break;
   case 'pnew':ad.edit=newDraft();ad.view='form';ad.confirmDel=false;render();window.scrollTo(0,0);break;
   case 'pedit':{const p=P(v);ad.edit=Object.assign(JSON.parse(JSON.stringify(p)),{price:String(p.price.toLocaleString('es-AR')),errors:{}});ad.view='form';ad.confirmDel=false;render();window.scrollTo(0,0);break}
   case 'phmain':{readForm();const d=ad.edit;const [x]=d.photos.splice(+v,1);d.photos.unshift(x);render();break}
   case 'phrm':readForm();ad.edit.photos.splice(+v,1);render();break;
   case 'ladd':{readForm();const f=t.dataset.f,inp=$('#add-'+f);const val=(inp.value||'').trim();if(val&&!ad.edit[f].some(x=>x.toLowerCase()===val.toLowerCase()))ad.edit[f].push(val);render();const n=$('#add-'+f);if(n)n.focus();break}
   case 'lrm':readForm();ad.edit[t.dataset.f].splice(+v,1);render();break;
   case 'pdel1':readForm();ad.confirmDel=true;render();break;
   case 'pdel0':ad.confirmDel=false;render();break;
   case 'pdel2':{const id=ad.edit.id;S.products=S.products.filter(p=>p.id!==id);cart=cart.filter(i=>i.pid!==id);save();ad.edit=null;ad.view='products';ad.confirmDel=false;toast('Producto eliminado.');render();break}
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){U.st.q=e.target.value;render()}
  else if(e.target.id==='aq'){U.ad.q=e.target.value;render()}
  else if(e.target.closest('#pf')&&['pf-name','pf-price','pf-code'].includes(e.target.id)){readForm();const ae=e.target.id,pos=e.target.selectionStart;render();const el=document.getElementById(ae);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}}}
});
document.addEventListener('change',e=>{
  if(e.target.id==='ph-in'){addFiles(e.target.files);}
  else if(e.target.closest('#co')&&e.target.name==='delivery'){readCheckout();render()}
  else if(e.target.closest('#pf')&&(e.target.id==='pf-cat'||e.target.id==='pf-vis')){readForm();render()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id&&e.target.id.startsWith('add-')){e.preventDefault();const b=document.querySelector('[data-act="ladd"][data-f="'+e.target.id.slice(4)+'"]');if(b)b.click()}
  if(e.key==='Escape'&&$('#overlay').innerHTML)closeDialog();
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='co'){readCheckout();if(validateCheckout())submitOrder();else{render();window.scrollTo(0,0)}}
  if(e.target.id==='pf'){readForm();if(validateForm())saveForm();else{render();window.scrollTo(0,0)}}
});
setInterval(()=>{const before=S.orders.filter(o=>o.status==='pendiente').length;expire();if(S.orders.filter(o=>o.status==='pendiente').length!==before)render()},30000);
render();
})();
</script>
